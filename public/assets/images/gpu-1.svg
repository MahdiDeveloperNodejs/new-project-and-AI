<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc226"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 150H800M0 300H800M0 450H800M200 0V600M400 0V600M600 0V600" fill="none"/>
  </g>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- کانکتور برق -->
  <rect x="340" y="158" width="140" height="30" rx="8" fill="#0d1119" stroke="#2a3348" stroke-width="2"/>
  <!-- بدنه کارت -->
  <rect x="130" y="190" width="540" height="230" rx="26" fill="#161c2a" stroke="#2a3348" stroke-width="2"/>
  <rect x="150" y="190" width="500" height="10" rx="5" fill="url(#topbar)" opacity="0.9"/>
  <!-- فن اول -->
  <g transform="translate(300 305)">
    <circle r="80" fill="#0d1119" stroke="#2a3348" stroke-width="3"/>
    <g fill="#212b40">
      <ellipse cx="0" cy="-42" rx="16" ry="52"/>
      <ellipse cx="0" cy="-42" rx="16" ry="52" transform="rotate(120)"/>
      <ellipse cx="0" cy="-42" rx="16" ry="52" transform="rotate(240)"/>
    </g>
    <circle r="22" fill="#ff7a1a"/>
    <circle r="9" fill="#0d1119"/>
  </g>
  <!-- فن دوم -->
  <g transform="translate(500 305)">
    <circle r="80" fill="#0d1119" stroke="#2a3348" stroke-width="3"/>
    <g fill="#212b40">
      <ellipse cx="0" cy="-42" rx="16" ry="52"/>
      <ellipse cx="0" cy="-42" rx="16" ry="52" transform="rotate(120)"/>
      <ellipse cx="0" cy="-42" rx="16" ry="52" transform="rotate(240)"/>
    </g>
    <circle r="22" fill="#ffc226"/>
    <circle r="9" fill="#0d1119"/>
  </g>
  <!-- براکت و پورت‌ها -->
  <rect x="670" y="200" width="18" height="210" rx="5" fill="#232b3d"/>
  <rect x="676" y="222" width="7" height="20" rx="2" fill="#0b0e15"/>
  <rect x="676" y="252" width="7" height="20" rx="2" fill="#0b0e15"/>
  <rect x="676" y="282" width="7" height="20" rx="2" fill="#0b0e15"/>
  <rect x="676" y="312" width="7" height="20" rx="2" fill="#0b0e15"/>
  <!-- برچسب -->
  <text x="400" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ff7a1a" opacity="0.9">ORCA RTX</text>
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="6" fill="#8b94a8">HIGH-END GRAPHICS</text>
</svg>
