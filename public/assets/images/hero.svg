<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc226"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2b"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <radialGradient id="heroglow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- هاله نئون -->
  <ellipse cx="450" cy="270" rx="380" ry="260" fill="url(#heroglow)"/>
  <circle cx="120" cy="140" r="5" fill="#ffc226" opacity="0.7"/>
  <circle cx="820" cy="110" r="4" fill="#ff7a1a" opacity="0.8"/>
  <circle cx="780" cy="420" r="5" fill="#ffc226" opacity="0.5"/>
  <circle cx="90" cy="460" r="4" fill="#ff7a1a" opacity="0.6"/>

  <!-- مانیتور -->
  <rect x="200" y="110" width="500" height="320" rx="22" fill="#10141f" stroke="#2a3348" stroke-width="3"/>
  <rect x="218" y="128" width="464" height="284" rx="12" fill="url(#screen)"/>
  <!-- خورشید سینث‌ویو -->
  <circle cx="450" cy="255" r="72" fill="url(#sun)"/>
  <g fill="#0a0d16">
    <rect x="378" y="235" width="144" height="7"/>
    <rect x="378" y="256" width="144" height="10"/>
    <rect x="378" y="281" width="144" height="14"/>
  </g>
  <!-- کوه‌ها -->
  <path d="M218 380 L300 300 L360 380 Z" fill="#161d2e"/>
  <path d="M340 380 L450 270 L560 380 Z" fill="#1b2336"/>
  <path d="M540 380 L620 310 L682 380 Z" fill="#161d2e"/>
  <!-- کف شبکه‌ای -->
  <g stroke="#ff7a1a" stroke-opacity="0.35" stroke-width="2">
    <line x1="218" y1="385" x2="682" y2="385"/>
    <line x1="240" y1="412" x2="660" y2="412"/>
    <line x1="270" y1="412" x2="220" y2="380" stroke-opacity="0.18"/>
    <line x1="630" y1="412" x2="680" y2="380" stroke-opacity="0.18"/>
  </g>
  <!-- پایه مانیتور -->
  <rect x="428" y="430" width="44" height="46" fill="#161c2a" stroke="#2a3348" stroke-width="2"/>
  <rect x="350" y="476" width="200" height="16" rx="8" fill="#161c2a" stroke="#2a3348" stroke-width="2"/>

  <!-- هدست آویزان -->
  <path d="M760 250 C 760 190, 690 190, 690 250" fill="none" stroke="#1d2434" stroke-width="14" stroke-linecap="round"/>
  <rect x="676" y="240" width="28" height="52" rx="12" fill="#232b3d" stroke="#2a3348" stroke-width="2"/>
  <rect x="746" y="240" width="28" height="52" rx="12" fill="#232b3d" stroke="#2a3348" stroke-width="2"/>
  <line x1="725" y1="180" x2="725" y2="160" stroke="#2a3348" stroke-width="6"/>

  <!-- کیبورد -->
  <rect x="230" y="560" width="300" height="80" rx="14" fill="#161c2a" stroke="#2a3348" stroke-width="2"/>
  <line x1="252" y1="588" x2="508" y2="588" stroke="#2a3348" stroke-width="16" stroke-dasharray="15 7"/>
  <line x1="252" y1="612" x2="508" y2="612" stroke="#2a3348" stroke-width="16" stroke-dasharray="15 7"/>
  <line x1="252" y1="612" x2="508" y2="612" stroke="#ff7a1a" stroke-opacity="0.35" stroke-width="16" stroke-dasharray="15 7"/>

  <!-- ماوس‌پد و ماوس -->
  <rect x="560" y="580" width="150" height="70" rx="10" fill="#121826" stroke="#2a3348" stroke-width="2"/>
  <rect x="596" y="590" width="76" height="56" rx="26" fill="#1d2434" stroke="#2a3348" stroke-width="2"/>
  <line x1="634" y1="596" x2="634" y2="618" stroke="#2a3348" stroke-width="3"/>
  <line x1="566" y1="646" x2="704" y2="646" stroke="#ffc226" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- میز -->
  <rect x="150" y="662" width="640" height="14" rx="7" fill="#1c2334"/>
  <rect x="190" y="676" width="12" height="60" fill="#161c2a"/>
  <rect x="740" y="676" width="12" height="60" fill="#161c2a"/>
</svg>
