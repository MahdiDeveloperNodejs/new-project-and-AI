<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 150H800M0 300H800M0 450H800M200 0V600M400 0V600M600 0V600" fill="none"/>
  </g>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- برد SSD -->
  <rect x="110" y="260" width="580" height="96" rx="16" fill="#161c2a" stroke="#2a3348" stroke-width="2"/>
  <!-- پین‌های طلایی اتصال -->
  <g fill="#d8b13a">
    <rect x="96" y="288" width="18" height="6" rx="2"/>
    <rect x="96" y="302" width="18" height="6" rx="2"/>
    <rect x="96" y="316" width="18" height="6" rx="2"/>
  </g>
  <!-- فرورفتگی پین -->
  <rect x="112" y="278" width="26" height="60" rx="6" fill="#0d1119" stroke="#2a3348" stroke-width="2"/>
  <!-- چیپ‌های حافظه -->
  <rect x="170" y="284" width="96" height="48" rx="7" fill="#212b40" stroke="#2a3348" stroke-width="2"/>
  <rect x="286" y="284" width="96" height="48" rx="7" fill="#212b40" stroke="#2a3348" stroke-width="2"/>
  <rect x="402" y="284" width="96" height="48" rx="7" fill="#212b40" stroke="#2a3348" stroke-width="2"/>
  <!-- کنترلر با برچسب نارنجی -->
  <rect x="518" y="284" width="130" height="48" rx="7" fill="#ff7a1a" opacity="0.85"/>
  <text x="583" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0e15">NVMe</text>
  <!-- پیچ‌ها -->
  <circle cx="126" cy="338" r="6" fill="#2a3348"/>
  <circle cx="672" cy="278" r="6" fill="#2a3348"/>
  <!-- برچسب -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#ff7a1a" opacity="0.9">BOLT NVMe</text>
  <text x="400" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="6" fill="#8b94a8">PCIe GEN4 SSD</text>
</svg>
