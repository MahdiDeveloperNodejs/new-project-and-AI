<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فراموشی رمز عبور | گیم‌تک</title>
  <meta name="description" content="بازیابی رمز عبور حساب کاربری گیم‌تک." />
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container auth-page">
    <div class="auth-card panel">
      <div class="auth-head">
        <span class="auth-logo">🔑</span>
        <h1>بازیابی رمز عبور</h1>
        <p>ایمیل یا شماره موبایل حساب خود را وارد کنید</p>
      </div>

      <!-- ارسال لینک/کد بازیابی نیاز به بک‌اند دارد -->
      <div class="demo-note">
        ارسال لینک بازیابی به بک‌اند نیاز دارد؛ این فرم فقط رابط کاربری است.
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-field">
          <label for="forgot-identifier">ایمیل یا شماره موبایل</label>
          <input type="text" id="forgot-identifier" name="identifier" placeholder="example@mail.com یا ۰۹۱۲…" autocomplete="username" />
          <small class="field-error"></small>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">ارسال لینک بازیابی</button>
      </form>

      <!-- پیام نتیجه توسط auth.js نمایش داده می‌شود -->
      <div id="forgot-notice" class="demo-note" style="margin-top:16px; margin-bottom:0" hidden></div>

      <p class="auth-footer">حساب خود را بازیابی کردید؟ <a href="login.html">وارد شوید</a></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
